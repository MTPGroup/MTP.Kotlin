ktor:
  application:
    modules:
      - tech.hanasaki.azusa.ApplicationKt.module
  deployment:
    port: 8080
database:
  driver: "org.postgresql.Driver"
  url: ${DB_URL}
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  maxPoolSize: 5
jwt:
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  realm: ${JWT_REALM}
  secret: ${JWT_SECRET}
  accessTokenMinutes: ${AUTH_ACCESS_TOKEN_MINUTES}
  refreshTokenDays: ${AUTH_REFRESH_TOKEN_DAYS}
s3:
  endpoint: ${S3_ENDPOINT}
  region: ${S3_REGION}
  bucket: ${S3_BUCKET}
  accessKey: ${S3_ACCESS_KEY}
  secretKey: ${S3_SECRET_KEY}
  publicBaseUrl: ${S3_PUBLIC_BASE_URL}
  forcePathStyle: ${S3_FORCE_PATH_STYLE}
smtp:
  host: ${SMTP_HOST}
  port: ${SMTP_PORT}
  username: ${SMTP_USERNAME}
  password: ${SMTP_PASSWORD}
  from: ${SMTP_FROM}
  tls: ${SMTP_TLS}
  enabled: ${SMTP_ENABLED}
otp:
  length: ${OTP_LENGTH}
  expiresMinutes: ${OTP_EXPIRES_MINUTES}
  minIntervalSeconds: ${OTP_MIN_INTERVAL_SECONDS}
  maxPerHour: ${OTP_MAX_PER_HOUR}
  debugReturn: ${OTP_DEBUG_RETURN}
llm:
  provider: ${LLM_PROVIDER}
  baseUrl: ${LLM_ENDPOINT}
  model: ${LLM_MODEL}
  apiKey: ${LLM_API_KEY}
  temperature: ${LLM_TEMPERATURE}
  returnThinking: ${LLM_RETURN_THINKING}
embedding:
  provider: ${EMBEDDING_PROVIDER}
  baseUrl: ${EMBEDDING_ENDPOINT}
  model: ${EMBEDDING_MODEL}
  apiKey: ${EMBEDDING_API_KEY}
  dimension: ${EMBEDDING_DIMENSION}
redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  password: ${REDIS_PASSWORD}
event:
  outbox:
    pollingIntervalSeconds: ${OUTBOX_POLLING_INTERVAL_SECONDS:10}
    batchSize: ${OUTBOX_BATCH_SIZE:100}
    maxRetries: ${OUTBOX_MAX_RETRIES:3}
    cleanupEnabled: ${OUTBOX_CLEANUP_ENABLED:true}
    cleanupIntervalMinutes: ${OUTBOX_CLEANUP_INTERVAL_MINUTES:1}
    retentionDays: ${OUTBOX_RETENTION_DAYS:7}
  stream:
    streamKey: ${STREAM_KEY}
    consumerGroup: ${CONSUMER_GROUP}
    consumerName: ${EVENT_STREAM_CONSUMER_NAME:azusa-instance-1}
    batchSize: ${STREAM_BATCH_SIZE:10}
    pollIntervalSeconds: ${STREAM_POLL_INTERVAL_SECONDS:1}
    claimIdleTimeSeconds: ${STREAM_CLAIM_IDLE_TIME_SECONDS:30}
    claimBatchSize: ${STREAM_CLAIM_BATCH_SIZE:100}
    claimIntervalSeconds: ${STREAM_CLAIM_INTERVAL_SECONDS:10}
    maxRetries: ${STREAM_MAX_RETRIES:3}
    dlqEnabled: ${STREAM_DLQ_ENABLED:true}
    dlqStreamKey: ${STREAM_DLQ_KEY:azusa:dlq:outbox-events}
