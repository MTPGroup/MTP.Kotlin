openapi: 3.0.3
info:
  title: Azusa API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
  /auth/sign-up/email:
    post:
      summary: Sign up with email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "200":
          description: Sign up result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignUpResponse"
  /auth/sign-in/email:
    post:
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInWithPasswordRequest"
      responses:
        "200":
          description: Sign in result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInWithPasswordResponse"
  /auth/refresh:
    post:
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Refresh result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshTokenResponse"
  /auth/sign-out:
    post:
      summary: Sign out
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignOutRequest"
      responses:
        "200":
          description: Sign out result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignOutResponse"
  /auth/email-otp/send-verification-otp:
    post:
      summary: Send email OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendEmailVerificationRequest"
      responses:
        "200":
          description: OTP send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendEmailVerificationResponse"
  /auth/email-otp/forget-password:
    post:
      summary: Send password reset OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendPasswordResetEmailRequest"
      responses:
        "200":
          description: OTP send result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendPasswordResetEmailResponse"
  /auth/email-otp/verify-email:
    post:
      summary: Verify email OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOTPRequest"
      responses:
        "204":
          description: Verified
  /auth/email-otp/reset-password:
    post:
      summary: Reset password with OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Reset result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordResponse"
  /profiles:
    get:
      summary: Get current profile
      responses:
        "200":
          description: Profile data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
    put:
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
  /profiles/avatar:
    post:
      summary: Upload avatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Upload result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarUploadResponse"
  /settings:
    get:
      summary: Get user settings
      responses:
        "200":
          description: Settings data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
    patch:
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
  /characters:
    get:
      summary: List characters
      parameters:
        - in: query
          name: page
          schema:
            type: integer
          required: false
        - in: query
          name: limit
          schema:
            type: integer
          required: false
        - in: query
          name: search
          schema:
            type: string
          required: false
      responses:
        "200":
          description: Character list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterListResponse"
    post:
      summary: Create character
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCharacterRequest"
      responses:
        "201":
          description: Character created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterDetailResponse"
  /characters/{id}:
    get:
      summary: Get character detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Character detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterDetailResponse"
    put:
      summary: Update character
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCharacterRequest"
      responses:
        "200":
          description: Character updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterDetailResponse"
    delete:
      summary: Delete character
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Character deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterActionResponse"
  /characters/{id}/knowledge-bases:
    get:
      summary: List character knowledge bases
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Knowledge base list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterKnowledgeBaseResponse"
    post:
      summary: Link knowledge base to character
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeBaseLinkRequest"
      responses:
        "201":
          description: Knowledge base linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterActionResponse"
  /characters/{id}/knowledge-bases/{kbId}:
    delete:
      summary: Unlink knowledge base from character
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: kbId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Knowledge base unlinked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterActionResponse"
  /contacts:
    get:
      summary: List contacts
      responses:
        "200":
          description: Contact list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactListResponse"
  /contacts/{characterId}:
    post:
      summary: Add contact
      parameters:
        - in: path
          name: characterId
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Contact added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactActionResponse"
    put:
      summary: Update contact
      parameters:
        - in: path
          name: characterId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContactRequest"
      responses:
        "200":
          description: Contact updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactActionResponse"
    delete:
      summary: Delete contact
      parameters:
        - in: path
          name: characterId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Contact deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactActionResponse"
  /plugins:
    get:
      summary: List plugins
      parameters:
        - in: query
          name: status
          schema:
            type: string
          required: false
        - in: query
          name: authorId
          schema:
            type: string
          required: false
      responses:
        "200":
          description: Plugin list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginListResponse"
    post:
      summary: Create plugin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePluginRequest"
      responses:
        "201":
          description: Plugin created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginDetailResponse"
  /plugins/{id}:
    get:
      summary: Get plugin detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plugin detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginDetailResponse"
    put:
      summary: Update plugin
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePluginRequest"
      responses:
        "200":
          description: Plugin updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginDetailResponse"
    delete:
      summary: Delete plugin
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plugin deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginActionResponse"
  /plugins/{id}/subscribe:
    post:
      summary: Subscribe plugin
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginActionResponse"
    delete:
      summary: Unsubscribe plugin
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Unsubscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginActionResponse"
  /plugins/{id}/like:
    post:
      summary: Like plugin
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Liked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginActionResponse"
    delete:
      summary: Unlike plugin
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Unliked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginActionResponse"
  /chats:
    get:
      summary: List chats
      responses:
        "200":
          description: Chat list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatListResponse"
  /chats/private:
    post:
      summary: Create private chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrivateChatRequest"
      responses:
        "201":
          description: Chat created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatDetailResponse"
  /chats/{chatId}:
    get:
      summary: Get chat detail
      parameters:
        - in: path
          name: chatId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chat detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatDetailResponse"
    patch:
      summary: Update chat
      parameters:
        - in: path
          name: chatId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChatRequest"
      responses:
        "200":
          description: Chat updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatDetailResponse"
    delete:
      summary: Delete chat
      parameters:
        - in: path
          name: chatId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chat deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatActionResponse"
  /chats/{chatId}/messages:
    get:
      summary: List chat messages
      parameters:
        - in: path
          name: chatId
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
          required: false
        - in: query
          name: before
          schema:
            type: string
          required: false
      responses:
        "200":
          description: Message list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessagesResponse"
  /chats/{chatId}/messages/stream:
    post:
      summary: Stream chat messages
      parameters:
        - in: path
          name: chatId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
  /knowledge/bases:
    get:
      summary: List knowledge bases
      parameters:
        - in: query
          name: public
          schema:
            type: boolean
          required: false
        - in: query
          name: authorId
          schema:
            type: string
          required: false
      responses:
        "200":
          description: Knowledge base list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBaseListResponse"
    post:
      summary: Create knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKnowledgeBaseRequest"
      responses:
        "201":
          description: Knowledge base created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBaseDetailResponse"
  /knowledge/bases/{id}:
    get:
      summary: Get knowledge base detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Knowledge base detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBaseDetailResponse"
    patch:
      summary: Update knowledge base
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKnowledgeBaseRequest"
      responses:
        "200":
          description: Knowledge base updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeBaseDetailResponse"
    delete:
      summary: Delete knowledge base
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Knowledge base deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentResponse"
  /knowledge/bases/{id}/files:
    get:
      summary: List knowledge base files
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeFileListResponse"
  /knowledge/bases/{id}/files/{fileId}:
    delete:
      summary: Delete knowledge base file
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: fileId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentResponse"
  /knowledge/bases/{id}/documents:
    post:
      summary: Upload knowledge document
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                metadata:
                  type: string
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeDocumentJsonRequest"
      responses:
        "201":
          description: Document queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocumentResponse"
  /knowledge/search:
    post:
      summary: Search knowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeSearchRequest"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSearchResponse"
components:
  schemas:
    ProfileData:
      type: object
      properties:
        id:
          type: string
        uid:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        avatar:
          type: string
          nullable: true
        created_at:
          type: string
          nullable: true
        updated_at:
          type: string
          nullable: true
      required:
        - id
    ProfileResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/ProfileData"
      required:
        - success
        - message
        - data
    UpdateProfileRequest:
      type: object
      properties:
        username:
          type: string
          nullable: true
        avatar:
          type: string
          nullable: true
    AvatarUploadData:
      type: object
      properties:
        avatarUrl:
          type: string
        profile:
          $ref: "#/components/schemas/ProfileData"
      required:
        - avatarUrl
        - profile
    AvatarUploadResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/AvatarUploadData"
      required:
        - success
        - message
        - data
    SettingsData:
      type: object
      properties:
        ownerId:
          type: string
        theme:
          type: string
        chatModels:
          type: object
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - ownerId
        - theme
        - chatModels
        - createdAt
        - updatedAt
    SettingsResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/SettingsData"
      required:
        - success
        - message
        - data
    UpdateSettingsRequest:
      type: object
      properties:
        theme:
          type: string
          nullable: true
        chatModels:
          type: object
          nullable: true
    UserProfile:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        image:
          type: string
          nullable: true
        emailVerified:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - email
        - name
        - emailVerified
        - createdAt
        - updatedAt
    SignUpRequest:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        password:
          type: string
        callbackURL:
          type: string
      required:
        - email
        - name
        - password
        - callbackURL
    SignUpResponse:
      type: object
      properties:
        token:
          type: string
          nullable: true
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - user
        - refreshToken
    SignInWithPasswordRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    SignInWithPasswordResponse:
      type: object
      properties:
        redirect:
          type: boolean
        token:
          type: string
        refreshToken:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - redirect
        - token
        - refreshToken
        - user
    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    RefreshTokenResponse:
      type: object
      properties:
        token:
          type: string
        refreshToken:
          type: string
      required:
        - token
        - refreshToken
    SignOutResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    SignOutRequest:
      type: object
      properties:
        refreshToken:
          type: string
    SendEmailVerificationRequest:
      type: object
      properties:
        email:
          type: string
        type:
          type: string
          enum:
            - sign-in
            - reset-password
            - email-verification
      required:
        - email
        - type
    SendEmailVerificationResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    SendPasswordResetEmailRequest:
      type: object
      properties:
        email:
          type: string
      required:
        - email
    SendPasswordResetEmailResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    VerifyOTPRequest:
      type: object
      properties:
        email:
          type: string
        otp:
          type: string
      required:
        - email
        - otp
    ResetPasswordRequest:
      type: object
      properties:
        email:
          type: string
        otp:
          type: string
        password:
          type: string
      required:
        - email
        - otp
        - password
    ResetPasswordResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    CreateCharacterRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        bio:
          type: string
        avatar:
          type: string
        originPrompt:
          type: string
        isPublic:
          type: boolean
    UpdateCharacterRequest:
      type: object
      properties:
        name:
          type: string
        bio:
          type: string
        avatar:
          type: string
        originPrompt:
          type: string
        isPublic:
          type: boolean
    CharacterListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/CharacterListData"
    CharacterListData:
      type: object
      properties:
        characters:
          type: array
          items:
            $ref: "#/components/schemas/CharacterSummary"
        pagination:
          $ref: "#/components/schemas/Pagination"
    CharacterSummary:
      type: object
      properties:
