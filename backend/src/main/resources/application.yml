spring:
  application:
    name: backend
  docker:
    compose:
      file: backend/compose.yaml
  modulith:
    events:
      republish-outstanding-events-on-restart: true
  flyway:
    enabled: true
  datasource:
    hikari:
      maximum-pool-size: 5
      auto-commit: true
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
  freemarker:
    cache: false
    suffix: .html
    charset: UTF-8
    template-loader-path: classpath:/templates/

server:
  port: 8080

jwt:
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  realm: ${JWT_REALM}
  secret: ${JWT_SECRET}
  accessTokenMinutes: ${AUTH_ACCESS_TOKEN_MINUTES}
  refreshTokenDays: ${AUTH_REFRESH_TOKEN_DAYS}

s3:
  endpoint: ${S3_ENDPOINT}
  region: ${S3_REGION}
  bucket: ${S3_BUCKET}
  accessKey: ${S3_ACCESS_KEY}
  secretKey: ${S3_SECRET_KEY}
  publicBaseUrl: ${S3_PUBLIC_BASE_URL}
  forcePathStyle: ${S3_FORCE_PATH_STYLE}

smtp:
  host: ${SMTP_HOST:localhost}
  port: ${SMTP_PORT:1025}
  username: ${SMTP_USERNAME:user}
  password: ${SMTP_PASSWORD:password}
  from: ${SMTP_FROM:no-reply@localhost}
  tls: ${SMTP_TLS:false}
  enabled: ${SMTP_ENABLED:true}

otp:
  length: ${OTP_LENGTH}
  expiresMinutes: ${OTP_EXPIRES_MINUTES}
  minIntervalSeconds: ${OTP_MIN_INTERVAL_SECONDS}
  maxPerHour: ${OTP_MAX_PER_HOUR}
  debugReturn: ${OTP_DEBUG_RETURN}

logging:
  level:
    org.springframework.modulith: DEBUG
