spring:
  application:
    name: backend
  docker:
    compose:
      file: backend/compose.yaml
  flyway:
    enabled: false

server:
  port: 8080

database:
  driver: "org.postgresql.Driver"
  url: ${DB_URL}
  user: ${DB_USER}
  password: ${DB_PASSWORD}
  maxPoolSize: 5

jwt:
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  realm: ${JWT_REALM}
  secret: ${JWT_SECRET}
  accessTokenMinutes: ${AUTH_ACCESS_TOKEN_MINUTES}
  refreshTokenDays: ${AUTH_REFRESH_TOKEN_DAYS}

s3:
  endpoint: ${S3_ENDPOINT}
  region: ${S3_REGION}
  bucket: ${S3_BUCKET}
  accessKey: ${S3_ACCESS_KEY}
  secretKey: ${S3_SECRET_KEY}
  publicBaseUrl: ${S3_PUBLIC_BASE_URL}
  forcePathStyle: ${S3_FORCE_PATH_STYLE}

smtp:
  host: ${SMTP_HOST}
  port: ${SMTP_PORT}
  username: ${SMTP_USERNAME}
  password: ${SMTP_PASSWORD}
  from: ${SMTP_FROM}
  tls: ${SMTP_TLS}
  enabled: ${SMTP_ENABLED}

otp:
  length: ${OTP_LENGTH}
  expiresMinutes: ${OTP_EXPIRES_MINUTES}
  minIntervalSeconds: ${OTP_MIN_INTERVAL_SECONDS}
  maxPerHour: ${OTP_MAX_PER_HOUR}
  debugReturn: ${OTP_DEBUG_RETURN}
